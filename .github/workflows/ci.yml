name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.jmlnotaris.com/api

  build_and_push_image:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set tag and API URL
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "TAG=prod" >> $GITHUB_ENV
            echo "API_URL=https://api.jmlnotaris.com/api" >> $GITHUB_ENV
          else
            echo "TAG=dev" >> $GITHUB_ENV
            echo "API_URL=https://api.jmlnotaris.com/api" >> $GITHUB_ENV
          fi

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${TAG}
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${API_URL} \
            -t $IMAGE -f Containerfile .
          docker push $IMAGE

  deploy_vps:
    if: github.event_name == 'push'
    needs: build_and_push_image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            if [ "${{ github.ref_name }}" = "main" ]; then
              podman pull ghcr.io/${{ github.repository }}:prod
              systemctl restart fe-prod
              systemctl --no-pager status fe-prod || true
            else
              podman pull ghcr.io/${{ github.repository }}:dev
              systemctl restart fe-dev
              systemctl --no-pager status fe-dev || true
            fi